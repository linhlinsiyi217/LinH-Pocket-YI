<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-glass="default" data-pblur="on" data-motion="full" data-frame="device">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LinH Pocket YI">
<title>小手机</title>
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/tokens.css?v=0.4.0-p6">
<link rel="stylesheet" href="css/base.css?v=0.4.0-p6">
<link rel="stylesheet" href="css/components.css?v=0.4.0-p6">
<link rel="stylesheet" href="css/surfaces.css?v=0.4.0-p6">
<link rel="stylesheet" href="css/widgets.css?v=0.4.0-p6">
<link rel="stylesheet" href="css/settings.css?v=0.4.0-p6">
<link rel="stylesheet" href="css/chat.css?v=0.4.0-p6">
<link rel="stylesheet" href="css/appearance.css?v=0.4.0-p6">
<link rel="stylesheet" href="css/lock.css?v=0.4.0-p6">
<link rel="stylesheet" href="css/passcode.css?v=0.4.0-p6">
<link rel="stylesheet" href="css/changelog.css?v=0.4.0-p6">
</head>
<body>
<div class="device">
  <div class="screen" data-lock="boot" style="--p:0">
    <div class="statusbar" aria-hidden="true"></div>
    <div class="layer layer-home"></div>
    <div class="layer layer-apps"></div>
    <div class="layer layer-overlay"></div>
    <div class="home-bar" hidden></div>
    <div class="watermark" aria-hidden="true">LinH Pocket YI / AI 陪伴</div>
    <!-- 锁屏：上滑或轻点空白处解锁（js/lock.js） -->
    <div class="lockscreen">
      <div class="lk-wall" aria-hidden="true"><i class="lk-blob lk-b1"></i><i class="lk-blob lk-b2"></i><i class="lk-blob lk-b3"></i><i class="lk-blob lk-b4"></i><i class="lk-grain"></i></div>
      <section class="lk-main" aria-label="锁屏，上滑或轻点空白处解锁" tabindex="0">
        <div class="lk-top">
          <svg class="lk-glyph" viewBox="0 0 20 22" aria-hidden="true"><path class="shackle" d="M5.5 10V7a4.5 4.5 0 0 1 9 0v3"/><rect x="3" y="10" width="14" height="10.5" rx="3"/></svg>
          <div class="lk-date"><span data-clock="md"></span><span class="sep"></span><span data-clock="w"></span></div>
          <div class="lk-time" data-clock="big"></div>
        </div>
        <div class="lk-notes" aria-label="通知" hidden></div>
        <p class="lk-hint">上滑解锁</p>
      </section>
      <div class="lk-homebar" aria-hidden="true"></div>
    </div>
    <!-- 启动画面 -->
    <section class="boot" aria-label="LinH Pocket YI，正在启动">
      <i class="boot-spine" aria-hidden="true"></i>
      <div class="boot-brand">
        <div class="boot-linh">LinH</div>
        <div class="boot-pocket">Pocket YI</div>
      </div>
      <i class="boot-corner" aria-hidden="true"></i>
      <div class="boot-fold" aria-hidden="true"><i></i><i></i></div>
      <button class="boot-enter" type="button" aria-label="进入 LinH Pocket YI">
        <span class="be-ring" aria-hidden="true"></span><span class="be-label">进入</span>
        <svg class="be-chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 9.5l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </section>
  </div>
</div>
<script src="js/core.js?v=0.4.0-p6"></script>
<script src="js/icons.js?v=0.4.0-p6"></script>
<script src="js/theme.js?v=0.4.0-p6"></script>
<script src="js/ui.js?v=0.4.0-p6"></script>
<script src="js/appearance.js?v=0.4.0-p6"></script>
<script src="js/nav.js?v=0.4.0-p6"></script>
<script src="js/api.js?v=0.4.0-p6"></script>
<script src="js/lifelike-core.js?v=0.4.0-p6"></script>
<script src="js/apps/widget-provider.js?v=0.4.0-p6"></script>
<script src="js/apps/home-widgets.js?v=0.4.0-p6"></script>
<script src="js/apps/home-media.js?v=0.4.0-p6"></script>
<script src="js/apps/home.js?v=0.4.0-p6"></script>
<script src="js/apps/settings.js?v=0.4.0-p6"></script>
<script src="js/apps/settings-pages.js?v=0.4.0-p6"></script>
<script src="js/apps/chat.js?v=0.4.0-p6"></script>
<script src="js/apps/chat-conv.js?v=0.4.0-p6"></script>
<script src="js/apps/chat-favs.js?v=0.4.0-p6"></script>
<script src="js/apps/chat-memory.js?v=0.4.0-p6"></script>
<script src="js/apps/appearance-page.js?v=0.4.0-p6"></script>
<script src="js/passcode.js?v=0.4.0-p6"></script>
<script src="js/lock.js?v=0.4.0-p6"></script>
<script src="js/keepalive.js?v=0.4.0-p6"></script>
<script src="js/changelog.js?v=0.4.0-p6"></script>
<script src="js/main.js?v=0.4.0-p6"></script>
</body>
</html>
