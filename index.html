<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-glass="default" data-pblur="on" data-motion="full" data-frame="device">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LinH Pocket YI">
<title>小手机</title>
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/surfaces.css">
<link rel="stylesheet" href="css/widgets.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/lock.css">
<link rel="stylesheet" href="css/passcode.css">
<link rel="stylesheet" href="css/changelog.css">
</head>
<body>
<div class="device">
  <div class="screen" data-lock="boot" style="--p:0">
    <div class="statusbar" aria-hidden="true"></div>
    <div class="layer layer-home"></div>
    <div class="layer layer-apps"></div>
    <div class="layer layer-overlay"></div>
    <div class="home-bar" hidden></div>
    <div class="watermark" aria-hidden="true">LinH Pocket YI / AI 陪伴</div>
    <!-- 锁屏：上滑或轻点空白处解锁（js/lock.js） -->
    <div class="lockscreen">
      <div class="lk-wall" aria-hidden="true"><i class="lk-blob lk-b1"></i><i class="lk-blob lk-b2"></i><i class="lk-blob lk-b3"></i><i class="lk-blob lk-b4"></i><i class="lk-grain"></i></div>
      <section class="lk-main" aria-label="锁屏，上滑或轻点空白处解锁" tabindex="0">
        <div class="lk-top">
          <svg class="lk-glyph" viewBox="0 0 20 22" aria-hidden="true"><path class="shackle" d="M5.5 10V7a4.5 4.5 0 0 1 9 0v3"/><rect x="3" y="10" width="14" height="10.5" rx="3"/></svg>
          <div class="lk-date"><span data-clock="md"></span><span class="sep"></span><span data-clock="w"></span></div>
          <div class="lk-time" data-clock="big"></div>
        </div>
        <div class="lk-notes" aria-label="通知" hidden></div>
        <p class="lk-hint">上滑解锁</p>
      </section>
      <div class="lk-homebar" aria-hidden="true"></div>
    </div>
    <!-- 启动画面 -->
    <section class="boot" aria-label="LinH Pocket YI，正在启动">
      <i class="boot-spine" aria-hidden="true"></i>
      <div class="boot-brand">
        <div class="boot-linh">LinH</div>
        <div class="boot-pocket">Pocket YI</div>
      </div>
      <i class="boot-corner" aria-hidden="true"></i>
      <div class="boot-fold" aria-hidden="true"><i></i><i></i></div>
    </section>
  </div>
</div>
<script src="js/core.js"></script>
<script src="js/icons.js"></script>
<script src="js/theme.js"></script>
<script src="js/ui.js"></script>
<script src="js/nav.js"></script>
<script src="js/api.js"></script>
<script src="js/lifelike-core.js"></script>
<script src="js/apps/widget-provider.js"></script>
<script src="js/apps/home-widgets.js"></script>
<script src="js/apps/home-media.js"></script>
<script src="js/apps/home.js"></script>
<script src="js/apps/settings.js"></script>
<script src="js/apps/settings-pages.js"></script>
<script src="js/apps/chat.js"></script>
<script src="js/apps/chat-conv.js"></script>
<script src="js/passcode.js"></script>
<script src="js/lock.js"></script>
<script src="js/keepalive.js"></script>
<script src="js/changelog.js"></script>
<script src="js/main.js"></script>
</body>
</html>
