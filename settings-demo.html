<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0">
  <title>设置 - 高保真展示</title>
  <style>
    :root {
      --white: #FFFFFF;
      --bg-page: #F2F2F7;
      --text-black: #000000;
      --text-dark: #1C1C1E;
      --text-gray: #3C3C43;
      --text-secondary: #8A8A8E;
      --text-tertiary: #C7C7CC;
      --separator: rgba(60, 60, 67, 0.1);
      --accent-blue: #007AFF;
      --accent-green: #34C759;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    /* 手机框架 */
    .phone {
      width: 375px;
      height: 812px;
      background: #000;
      border-radius: 54px;
      padding: 8px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5);
    }

    .screen {
      width: 100%;
      height: 100%;
      background: var(--bg-page);
      border-radius: 47px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 状态栏 */
    .status-bar {
      height: 54px;
      padding: 14px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      background: var(--bg-page);
      position: relative;
    }

    .time {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-black);
    }

    .notch {
      width: 90px;
      height: 28px;
      background: #000;
      border-radius: 14px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 12px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-icons svg {
      width: 16px;
      height: 16px;
      fill: var(--text-black);
    }

    .battery {
      display: flex;
      align-items: center;
      gap: 1px;
    }

    .battery-body {
      width: 22px;
      height: 11px;
      border: 1px solid var(--text-black);
      border-radius: 3px;
      padding: 1px;
    }

    .battery-level {
      width: 75%;
      height: 100%;
      background: var(--text-black);
      border-radius: 1px;
    }

    .battery-cap {
      width: 2px;
      height: 5px;
      background: var(--text-black);
      border-radius: 0 1px 1px 0;
    }

    /* 大标题 */
    .header {
      padding: 0 20px 8px;
      background: var(--bg-page);
    }

    .large-title {
      font-size: 34px;
      font-weight: 700;
      color: var(--text-black);
      letter-spacing: -0.5px;
    }

    /* 搜索框 */
    .search-bar {
      margin: 8px 20px 20px;
      height: 36px;
      background: rgba(120, 120, 128, 0.12);
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 6px;
    }

    .search-bar svg {
      width: 16px;
      height: 16px;
      fill: var(--text-secondary);
      flex-shrink: 0;
    }

    .search-bar span {
      font-size: 17px;
      color: var(--text-secondary);
    }

    /* 滚动区域 */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 34px;
    }

    /* 分组 */
    .group {
      background: var(--white);
      border-radius: 12px;
      margin-bottom: 35px;
      overflow: hidden;
    }

    /* 用户卡片 */
    .user-card {
      display: flex;
      align-items: center;
      padding: 10px 16px;
      gap: 14px;
    }

    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #E5E5EA;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .avatar svg {
      width: 30px;
      height: 30px;
      fill: #8E8E93;
    }

    .user-info {
      flex: 1;
    }

    .user-name {
      font-size: 22px;
      font-weight: 400;
      color: var(--text-black);
    }

    .user-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .chevron {
      font-size: 20px;
      color: var(--text-tertiary);
      font-weight: 300;
    }

    /* 列表项 */
    .item {
      display: flex;
      align-items: center;
      padding: 11px 16px;
      min-height: 44px;
      gap: 14px;
      position: relative;
    }

    .item:not(:last-child)::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 60px;
      right: 0;
      height: 0.5px;
      background: var(--separator);
    }

    /* 图标 - 简洁灰色线性 */
    .icon {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #3C3C43;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .icon.filled svg {
      fill: #3C3C43;
      stroke: none;
    }

    .item-content {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 17px;
      color: var(--text-black);
    }

    .item-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 1px;
    }

    .item-value {
      font-size: 17px;
      color: var(--text-secondary);
    }

    .item-chevron {
      color: var(--text-tertiary);
      font-size: 18px;
      font-weight: 300;
      margin-left: 4px;
    }

    /* 开关 */
    .switch {
      width: 51px;
      height: 31px;
      background: #E5E5EA;
      border-radius: 16px;
      position: relative;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .switch.on {
      background: var(--accent-green);
    }

    .switch::after {
      content: '';
      position: absolute;
      width: 27px;
      height: 27px;
      background: var(--white);
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.2s;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15), 0 3px 1px rgba(0,0,0,0.06);
    }

    .switch.on::after {
      transform: translateX(20px);
    }

    /* 底部指示条 */
    .home-indicator {
      width: 134px;
      height: 5px;
      background: var(--text-black);
      border-radius: 3px;
      margin: 8px auto;
      opacity: 0.2;
    }

    /* 分组标题 */
    .group-label {
      font-size: 13px;
      color: var(--text-secondary);
      text-transform: uppercase;
      padding: 0 16px 8px;
      letter-spacing: -0.08px;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <!-- 状态栏 -->
      <div class="status-bar">
        <span class="time">9:41</span>
        <div class="notch"></div>
        <div class="status-icons">
          <svg viewBox="0 0 18 12"><path d="M1 4.5C3.5 2 7 1 9 1s5.5 1 8 3.5M3 7c1.8-1.8 4-2.5 6-2.5s4.2.7 6 2.5M6 10c1-1 2-1.5 3-1.5s2 .5 3 1.5"/><circle cx="9" cy="11" r="1"/></svg>
          <div class="battery">
            <div class="battery-body"><div class="battery-level"></div></div>
            <div class="battery-cap"></div>
          </div>
        </div>
      </div>

      <!-- 大标题 -->
      <div class="header">
        <h1 class="large-title">设置</h1>
      </div>

      <!-- 搜索框 -->
      <div class="search-bar">
        <svg viewBox="0 0 20 20"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="2"/><path d="M13 13l5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>搜索</span>
      </div>

      <!-- 内容 -->
      <div class="content">
        <!-- 用户卡片 -->
        <div class="group">
          <div class="user-card">
            <div class="avatar">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M12 14c-4 0-8 2-8 4v2h16v-2c0-2-4-4-8-4z" fill="currentColor"/></svg>
            </div>
            <div class="user-info">
              <div class="user-name">用户</div>
              <div class="user-subtitle">账户、云端等</div>
            </div>
            <span class="chevron">›</span>
          </div>
        </div>

        <!-- 连接设置 -->
        <div class="group">
          <div class="item">
            <div class="icon">
              <svg viewBox="0 0 24 24"><path d="M12 19l-7-7 1.4-1.4L12 16.2l5.6-5.6L19 12z"/><path d="M12 13l-7-7 1.4-1.4L12 10.2l5.6-5.6L19 6z"/></svg>
            </div>
            <div class="item-content">
              <div class="item-title">飞行模式</div>
            </div>
            <div class="switch" onclick="this.classList.toggle('on')"></div>
          </div>
          <div class="item">
            <div class="icon">
              <svg viewBox="0 0 24 24"><path d="M5 12.5l2 2c2.5-2.5 6.5-2.5 9 0l2-2c-3.5-3.5-9.5-3.5-13 0z"/><path d="M1 8.5l2 2c4.5-4.5 11.5-4.5 16 0l2-2c-5.5-5.5-14.5-5.5-20 0z"/><circle cx="12" cy="17" r="2"/></svg>
            </div>
            <div class="item-content">
              <div class="item-title">API 连接</div>
            </div>
            <span class="item-value">已配置</span>
            <span class="item-chevron">›</span>
          </div>
          <div class="item">
            <div class="icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            </div>
            <div class="item-content">
              <div class="item-title">语音设定</div>
            </div>
            <span class="item-chevron">›</span>
          </div>
        </div>

        <!-- 通用设置 -->
        <div class="group">
          <div class="item">
            <div class="icon filled">
              <svg viewBox="0 0 24 24"><path d="M19.4 13c0-.3.1-.6.1-1s0-.7-.1-1l2.1-1.6c.2-.2.2-.4.1-.6l-2-3.5c-.1-.2-.4-.3-.6-.2l-2.5 1c-.5-.4-1.1-.7-1.7-1l-.4-2.6c0-.3-.2-.4-.5-.4h-4c-.2 0-.4.2-.5.4l-.4 2.7c-.6.2-1.1.6-1.7 1l-2.4-1c-.2-.1-.5 0-.6.2l-2 3.5c-.1.2-.1.5.1.6l2.1 1.6c0 .3-.1.6-.1 1s0 .7.1 1l-2.1 1.6c-.2.2-.2.4-.1.6l2 3.5c.1.2.4.3.6.2l2.4-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .3.2.5.5.5h4c.2 0 .4-.2.5-.4l.4-2.7c.6-.2 1.2-.6 1.7-1l2.4 1c.2.1.5 0 .6-.2l2-3.5c.1-.2.1-.5-.1-.6l-2-1.6zM12 15.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z"/></svg>
            </div>
            <div class="item-content">
              <div class="item-title">通用</div>
            </div>
            <span class="item-chevron">›</span>
          </div>
          <div class="item">
            <div class="icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg>
            </div>
            <div class="item-content">
              <div class="item-title">显示与亮度</div>
            </div>
            <span class="item-chevron">›</span>
          </div>
          <div class="item">
            <div class="icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </div>
            <div class="item-content">
              <div class="item-title">主屏幕与 App 资源库</div>
            </div>
            <span class="item-chevron">›</span>
          </div>
          <div class="item">
            <div class="icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2.5 2.5"/></svg>
            </div>
            <div class="item-content">
              <div class="item-title">辅助功能</div>
            </div>
            <span class="item-chevron">›</span>
          </div>
        </div>

        <!-- 数据设置 -->
        <div class="group">
          <div class="item">
            <div class="icon">
              <svg viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg>
            </div>
            <div class="item-content">
              <div class="item-title">数据管理</div>
            </div>
            <span class="item-chevron">›</span>
          </div>
          <div class="item">
            <div class="icon">
              <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            </div>
            <div class="item-content">
              <div class="item-title">云备份</div>
            </div>
            <span class="item-value">已开启</span>
            <span class="item-chevron">›</span>
          </div>
        </div>
      </div>

      <!-- 底部指示条 -->
      <div class="home-indicator"></div>
    </div>
  </div>
</body>
</html>
