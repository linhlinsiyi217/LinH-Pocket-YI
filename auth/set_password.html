<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF0F6">
<title>设置登录密码 · LinH Pocket YI</title>
<script>try{var t=(JSON.parse(localStorage.getItem('xs.v1.settings')||'{}').theme)||'system';if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="set-password">
<div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<main class="wrap">
  <section class="panel">
    <div id="password-view">
      <header class="brand">
        <img src="../icons/icon-512.png" alt="" width="60" height="60">
        <h1>设置登录密码</h1>
        <p class="sub">后续登录将使用邮箱+密码</p>
      </header>
      <form id="password-form" novalidate>
        <div class="field">
          <label for="password">新密码</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" placeholder="至少 6 位" required aria-describedby="password-err">
          <p class="err" id="password-err" role="alert"></p>
        </div>
        <div class="field">
          <label for="password2">再输一次</label>
          <input id="password2" name="password2" type="password" autocomplete="new-password" minlength="6" placeholder="和上面保持一致" required aria-describedby="password2-err">
          <p class="err" id="password2-err" role="alert"></p>
        </div>
        <p class="form-msg" role="status" aria-live="polite"></p>
        <button class="btn" type="submit" disabled>确认</button>
      </form>
    </div>

    <!-- 链接失效、过期，或没从邮件打开 -->
    <div id="expired-view" class="state" hidden>
      <div class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/></svg></div>
      <h1 tabindex="-1">链接已失效</h1>
      <p>请从最新的验证邮件打开，<br>或者重新注册一次。</p>
      <a class="btn" href="register.html" data-nav>重新注册</a>
      <a class="btn btn-glass" href="login.html" data-nav>返回登录</a>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
</body>
</html>
