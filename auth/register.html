<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF0F6">
<title>注册 · LinH Pocket YI</title>
<script>try{var t=(JSON.parse(localStorage.getItem('xs.v1.settings')||'{}').theme)||'system';if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="register">
<div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<main class="wrap">
  <section class="panel">
    <div id="register-view">
      <header class="brand">
        <img src="../icons/icon-512.png" alt="" width="60" height="60">
        <h1>LinH Pocket YI</h1>
        <p class="sub">创建你的专属空间</p>
      </header>
      <form id="register-form" novalidate>
        <div class="field">
          <label for="email">邮箱地址</label>
          <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" required aria-describedby="email-err">
          <p class="err" id="email-err" role="alert"></p>
        </div>
        <div class="field">
          <label for="qq">QQ 号</label>
          <input id="qq" name="qq" type="text" inputmode="numeric" autocomplete="off" pattern="[0-9]*" maxlength="11" placeholder="只填数字" required aria-describedby="qq-err">
          <p class="err" id="qq-err" role="alert"></p>
        </div>
        <div class="field">
          <label for="invite">邀请码</label>
          <input id="invite" name="invite" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="每个邀请码只能用一次" required aria-describedby="invite-err">
          <p class="err" id="invite-err" role="alert"></p>
        </div>
        <p class="form-msg" role="status" aria-live="polite"></p>
        <button class="btn" type="submit">注册</button>
      </form>
      <p class="alt">已有账号？<a href="login.html" data-nav>直接登录</a></p>
    </div>

    <!-- 发送验证邮件后显示 -->
    <div id="sent-view" class="state" hidden>
      <div class="glyph" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg></div>
      <h1 tabindex="-1">去邮箱确认</h1>
      <p>验证邮件已发到 <b id="sent-email"></b>。<br>点开邮件里的链接，就能设置登录密码。<br>没收到的话，看看垃圾邮件。</p>
      <a class="btn btn-glass" href="login.html" data-nav>返回登录</a>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
</body>
</html>
