<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EEF0F6">
<title>登录 · LinH Pocket YI</title>
<!-- 跟随小手机里“外观”的深浅设置（没设置过就跟随系统），在绘制前写好，避免闪一下 -->
<script>try{var t=(JSON.parse(localStorage.getItem('xs.v1.settings')||'{}').theme)||'system';if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
<div class="bg" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i></div>
<main class="wrap">
  <section class="panel">
    <header class="brand">
      <img src="../icons/icon-512.png" alt="" width="60" height="60">
      <h1>LinH Pocket YI</h1>
      <p class="sub">欢迎回来</p>
    </header>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">邮箱地址</label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" required aria-describedby="email-err">
        <p class="err" id="email-err" role="alert"></p>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="至少 6 位" required aria-describedby="password-err">
        <p class="err" id="password-err" role="alert"></p>
      </div>
      <p class="form-msg" role="status" aria-live="polite"></p>
      <button class="btn" type="submit">登录</button>
    </form>
    <p class="alt">还没有账号？<a href="register.html" data-nav>去注册</a></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
</body>
</html>
