<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=375, initial-scale=1.0">
  <title>桌面 - 高保真展示</title>
  <style>
    :root {
      --white: #FFFFFF;
      --bg-page: #F2F2F7;
      --text-black: #000000;
      --text-dark: #1C1C1E;
      --text-gray: #3C3C43;
      --text-secondary: #8A8A8E;
      --text-tertiary: #C7C7CC;
      --separator: rgba(60, 60, 67, 0.1);
      --accent-blue: #007AFF;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      background: #1a1a1a;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    /* 手机框架 */
    .phone {
      width: 375px;
      height: 812px;
      background: #000;
      border-radius: 54px;
      padding: 8px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5);
    }

    .screen {
      width: 100%;
      height: 100%;
      background: var(--white);
      border-radius: 47px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 壁纸 - 纯净浅灰白渐变 */
    .wallpaper {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #FAFAFA 0%, #F0F0F5 50%, #E8E8ED 100%);
      z-index: 0;
    }

    /* 状态栏 */
    .status-bar {
      height: 54px;
      padding: 14px 28px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
      z-index: 10;
    }

    .time {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-black);
    }

    .notch {
      width: 90px;
      height: 28px;
      background: #000;
      border-radius: 14px;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 12px;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-icons svg {
      width: 16px;
      height: 16px;
      fill: var(--text-black);
    }

    .battery {
      display: flex;
      align-items: center;
      gap: 1px;
    }

    .battery-body {
      width: 22px;
      height: 11px;
      border: 1px solid var(--text-black);
      border-radius: 3px;
      padding: 1px;
    }

    .battery-level {
      width: 75%;
      height: 100%;
      background: var(--text-black);
      border-radius: 1px;
    }

    .battery-cap {
      width: 2px;
      height: 5px;
      background: var(--text-black);
      border-radius: 0 1px 1px 0;
    }

    /* 主内容区 */
    .home-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 40px 28px 0;
      position: relative;
      z-index: 1;
    }

    /* 应用网格 */
    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px 20px;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .app-item:active .app-icon {
      transform: scale(0.9);
      opacity: 0.7;
    }

    /* 应用图标 - 纯净黑白灰风格 */
    .app-icon {
      width: 56px;
      height: 56px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, opacity 0.1s;
      position: relative;
    }

    /* 浅色图标底板 */
    .app-icon.light {
      background: var(--white);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08), 0 0 1px rgba(0, 0, 0, 0.1);
    }

    /* 深色图标底板 */
    .app-icon.dark {
      background: var(--text-dark);
    }

    /* 灰色图标底板 */
    .app-icon.gray {
      background: #8E8E93;
    }

    .app-icon svg {
      width: 28px;
      height: 28px;
    }

    .app-icon.light svg {
      fill: none;
      stroke: var(--text-dark);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .app-icon.dark svg,
    .app-icon.gray svg {
      fill: none;
      stroke: var(--white);
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* 填充型图标 */
    .app-icon svg.filled {
      fill: currentColor;
      stroke: none;
    }

    .app-icon.light svg.filled {
      fill: var(--text-dark);
    }

    .app-icon.dark svg.filled,
    .app-icon.gray svg.filled {
      fill: var(--white);
    }

    .app-label {
      font-size: 11px;
      color: var(--text-dark);
      text-align: center;
      max-width: 64px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 底部 Dock - 轻玻璃效果 */
    .dock {
      position: relative;
      z-index: 10;
      margin: auto 12px 12px;
      height: 80px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 12px 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06), 0 0 1px rgba(0, 0, 0, 0.1);
    }

    /* Dock 顶部细高光 */
    .dock::before {
      content: '';
      position: absolute;
      top: 0;
      left: 24px;
      right: 24px;
      height: 0.5px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
    }

    .dock .app-item {
      gap: 4px;
    }

    .dock .app-icon {
      width: 52px;
      height: 52px;
      border-radius: 12px;
    }

    .dock .app-icon svg {
      width: 26px;
      height: 26px;
    }

    .dock .app-label {
      display: none;
    }

    /* 底部指示条 */
    .home-indicator {
      width: 134px;
      height: 5px;
      background: var(--text-black);
      border-radius: 3px;
      margin: 8px auto;
      opacity: 0.2;
      position: relative;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="screen">
      <div class="wallpaper"></div>

      <!-- 状态栏 -->
      <div class="status-bar">
        <span class="time">9:41</span>
        <div class="notch"></div>
        <div class="status-icons">
          <svg viewBox="0 0 18 12"><path d="M1 4C3.5 1.5 7 0.5 9 0.5s5.5 1 8 3.5M3 7c1.8-1.8 4-2.5 6-2.5s4.2.7 6 2.5M6 10c1-1 2-1.5 3-1.5s2 .5 3 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <div class="battery">
            <div class="battery-body"><div class="battery-level"></div></div>
            <div class="battery-cap"></div>
          </div>
        </div>
      </div>

      <!-- 主内容 -->
      <div class="home-content">
        <div class="app-grid">
          <!-- 第一行 -->
          <div class="app-item">
            <div class="app-icon gray">
              <svg class="filled" viewBox="0 0 24 24"><path d="M19.4 13c0-.3.1-.6.1-1s0-.7-.1-1l2.1-1.6c.2-.2.2-.4.1-.6l-2-3.5c-.1-.2-.4-.3-.6-.2l-2.5 1c-.5-.4-1.1-.7-1.7-1l-.4-2.6c0-.3-.2-.4-.5-.4h-4c-.2 0-.4.2-.5.4l-.4 2.7c-.6.2-1.1.6-1.7 1l-2.4-1c-.2-.1-.5 0-.6.2l-2 3.5c-.1.2-.1.5.1.6L4.6 11c0 .3-.1.6-.1 1s0 .7.1 1l-2.1 1.6c-.2.2-.2.4-.1.6l2 3.5c.1.2.4.3.6.2l2.4-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .3.2.5.5.5h4c.2 0 .4-.2.5-.4l.4-2.7c.6-.2 1.2-.6 1.7-1l2.4 1c.2.1.5 0 .6-.2l2-3.5c.1-.2.1-.5-.1-.6l-2-1.6zM12 15.5c-1.9 0-3.5-1.6-3.5-3.5s1.6-3.5 3.5-3.5 3.5 1.6 3.5 3.5-1.6 3.5-3.5 3.5z"/></svg>
            </div>
            <span class="app-label">设置</span>
          </div>
          <div class="app-item">
            <div class="app-icon dark">
              <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
            </div>
            <span class="app-label">聊天</span>
          </div>
          <div class="app-item">
            <div class="app-icon light">
              <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <span class="app-label">Char馆</span>
          </div>
          <div class="app-item">
            <div class="app-icon light">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor" stroke="none"/><path d="M21 15l-5-5L5 21"/></svg>
            </div>
            <span class="app-label">相册</span>
          </div>

          <!-- 第二行 -->
          <div class="app-item">
            <div class="app-icon light">
              <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </div>
            <span class="app-label">音乐</span>
          </div>
          <div class="app-item">
            <div class="app-icon light">
              <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
            </div>
            <span class="app-label">备忘录</span>
          </div>
          <div class="app-item">
            <div class="app-icon light">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
            </div>
            <span class="app-label">日历</span>
          </div>
          <div class="app-item">
            <div class="app-icon light">
              <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <span class="app-label">地图</span>
          </div>
        </div>
      </div>

      <!-- Dock -->
      <div class="dock">
        <div class="app-item">
          <div class="app-icon light">
            <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/></svg>
          </div>
        </div>
        <div class="app-item">
          <div class="app-icon dark">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
          </div>
        </div>
        <div class="app-item">
          <div class="app-icon light">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
          </div>
        </div>
      </div>

      <!-- 底部指示条 -->
      <div class="home-indicator"></div>
    </div>
  </div>
</body>
</html>
