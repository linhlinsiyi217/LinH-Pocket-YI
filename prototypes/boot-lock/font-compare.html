<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>锁屏字体对比 · 预览原型</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:#E9E9EE;color:#3C3C43;font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:24px 28px}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:18px}
  h1{font-size:17px;font-weight:600;color:#1C1C1E}
  .pick{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12);cursor:pointer}
  .pick input{display:none}
  .seg{display:inline-flex;padding:2px;border-radius:10px;background:rgba(0,0,0,.06)}
  .seg button{height:30px;padding:0 12px;border:0;border-radius:8px;background:none;font:inherit;color:inherit;cursor:pointer}
  .seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.1)}
  .seg button:disabled{opacity:.4;cursor:default}
  .cols{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
  figure{display:flex;flex-direction:column;align-items:center;gap:10px}
  figcaption{font-size:13px;font-weight:600;color:#1C1C1E}
  figcaption small{display:block;font-weight:400;color:#8A8A8E;text-align:center}
  iframe{width:410px;height:864px;border:0;background:transparent;transform:scale(var(--k,1));transform-origin:top center;margin-bottom:calc((var(--k,1) - 1) * 864px)}
  .info{max-width:900px;margin:0 auto 16px;padding:12px 16px;border-radius:12px;background:#fff;font-size:13px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
  .info b{color:#1C1C1E}
  .warn{color:#B4452F}
</style>
</head>
<body>
<header>
  <h1>锁屏字体对比</h1>
  <label class="pick">选择本机 TTF…<input type="file" id="file" accept=".ttf,.otf,font/ttf,font/otf"></label>
  <div class="seg" role="group" aria-label="测试字体用在哪里">
    <button data-scope="time" aria-pressed="true" disabled>只用于时间和日期</button>
    <button data-scope="all" aria-pressed="false" disabled>锁屏全部文字</button>
  </div>
</header>
<p class="info" id="info">字体只在这个页面的内存里读取和显示，不会上传，也不会复制进项目。选择字体后会显示它的名称、字重和嵌入许可字段。</p>
<div class="cols">
  <figure><iframe id="a" src="index.html?embed=1&clean=1&at=lock&notes=2" title="当前系统字体"></iframe>
    <figcaption>当前系统字体<small>项目现有字体栈，按设备回落</small></figcaption></figure>
  <figure><iframe id="b" src="index.html?embed=1&clean=1&at=lock&notes=2" title="测试字体"></iframe>
    <figcaption id="bCap">测试字体<small>尚未选择</small></figcaption></figure>
</div>
<script>
(function(){
  const $ = s => document.querySelector(s), b = $('#b');
  let buf = null, scope = 'time';
  const fit = () => document.querySelectorAll('iframe').forEach(f => f.style.setProperty('--k', Math.min(1, (innerHeight - 170) / 864).toFixed(3)));
  addEventListener('resize', fit); fit();

  // 读 name / OS/2 表：家族名、样式、字重、fsType（嵌入许可字段）
  function inspect(ab){
    const v = new DataView(ab), out = { names: {}, weight: null, fsType: null };
    const n = v.getUint16(4), T = {};
    for (let i = 0; i < n; i++) { const o = 12 + i * 16; T[String.fromCharCode(v.getUint8(o), v.getUint8(o + 1), v.getUint8(o + 2), v.getUint8(o + 3))] = v.getUint32(o + 8); }
    if (T.name != null) {
      const t = T.name, c = v.getUint16(t + 2), so = t + v.getUint16(t + 4);
      for (let i = 0; i < c; i++) {
        const r = t + 6 + i * 12, pid = v.getUint16(r), id = v.getUint16(r + 6), len = v.getUint16(r + 8), off = v.getUint16(r + 10);
        if (pid !== 3 || ![0, 1, 2, 4, 7, 8, 13].includes(id) || out.names[id]) continue;
        let s = ''; for (let k = 0; k + 1 < len; k += 2) s += String.fromCharCode(v.getUint16(so + off + k)); out.names[id] = s;
      }
    }
    if (T['OS/2'] != null) { out.weight = v.getUint16(T['OS/2'] + 4); out.fsType = v.getUint16(T['OS/2'] + 8); }
    return out;
  }
  const FS = t => t === 0 ? '0：可安装嵌入' : [t & 2 && '受限，不允许嵌入', t & 4 && '仅限预览和打印', t & 8 && '可编辑嵌入', t & 0x100 && '不允许子集化'].filter(Boolean).join('、');
  const esc = s => String(s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

  function send(){ if (buf) b.contentWindow.postMessage({ type: 'test-font', buf: buf.slice(0), scope }, '*'); }
  async function use(ab, fileName){
    buf = ab;
    const m = inspect(ab), N = m.names;
    $('#bCap').innerHTML = `测试字体<small>${esc(N[4] || N[1] || fileName)} · 字重 ${m.weight}</small>`;
    const apple = /apple|pingfang|dynacomware/i.test([N[0], N[7], N[8]].join(' '));
    $('#info').innerHTML = `<b>${esc(fileName)}</b><br>家族：${esc(N[1])}　样式：${esc(N[2])}　字重：${m.weight}<br>厂商：${esc(N[8])}<br>商标：${esc(N[7])}<br>版权：${esc(N[0])}<br>` +
      `嵌入许可字段（fsType）：<b>${esc(FS(m.fsType))}</b>${N[13] ? `<br>许可说明：${esc(N[13])}` : ''}` +
      (m.fsType & 6 || apple ? `<br><span class="warn">这是厂商授权字体（或其改版），许可字段不允许在网页里嵌入分发。这里只做本机对比，不建议内置进项目。</span>` : '') +
      (m.weight >= 600 ? `<br><span class="warn">这个文件只有一个字重（${m.weight}），浏览器无法从它生成细体，用在正文或大号时间上都会整体变粗。</span>` : '');
    document.querySelectorAll('[data-scope]').forEach(x => x.disabled = false);
    send();
  }
  $('#file').addEventListener('change', async e => { const f = e.target.files[0]; if (f) use(await f.arrayBuffer(), f.name); });
  document.querySelector('.seg').addEventListener('click', e => {
    const x = e.target.closest('[data-scope]'); if (!x || x.disabled) return;
    scope = x.dataset.scope;
    document.querySelectorAll('[data-scope]').forEach(y => y.setAttribute('aria-pressed', y === x));
    b.contentWindow.postMessage({ type: 'test-font', scope }, '*');
  });
  // 截图工具用：?font=<本机地址> 自动载入（只在本机服务上有效）
  const q = new URLSearchParams(location.search);
  if (q.get('scope')) { scope = q.get('scope'); document.querySelectorAll('[data-scope]').forEach(y => y.setAttribute('aria-pressed', y.dataset.scope === scope)); }
  if (q.get('font')) b.addEventListener('load', async () => use(await (await fetch(q.get('font'))).arrayBuffer(), q.get('name') || q.get('font')), { once: true });
  window.fontCompare = { setScope: s => document.querySelector(`[data-scope="${s}"]`).click() };
})();
</script>
</body>
</html>
